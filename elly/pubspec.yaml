name: elly
description: ELLY — Emergency safety application with Manual SOS (Phase 1).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────
  go_router: ^14.2.7

  # ── UI / Typography ──────────────────────────────────
  google_fonts: ^6.2.1

  # ── Utilities ────────────────────────────────────────
  uuid: ^4.4.2
  equatable: ^2.0.7
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

  # ── Logging ──────────────────────────────────────────
  talker_flutter: ^4.4.0
  talker_riverpod_logger: ^4.4.0

  # ── Audio & Speech ─────────────────────────────────────
  audioplayers: ^6.1.0
  record: ^7.1.1
  flutter_tts: ^4.2.0

  # ── Network ───────────────────────────────────────────
  http: ^1.2.1

  # ── Hardware & Sensors ────────────────────────────────
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  battery_plus: ^6.0.1
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.5
  intl: ^0.19.0

  # ── Code Generation ───────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ───────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^2.5.7
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

  # ── Testing ───────────────────────────────────────────
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
